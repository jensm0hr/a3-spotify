@if(album) {
	<div class="row">
		<div class="col-12 col-sm-6">
			<!--Populates with album name-->
			<h1>{{album.name}}</h1>
			<!--Sets src to album image URL-->
			<img id="albumImg" [src]="album.imageURL">
			<!--Adds thermometer with album's popularity -->
			<app-thermometer label="Popularity" [popularity]="album.popularity"></app-thermometer>
			<!--Uses @for to loop over album artists-->
			@for(artist of album.artists; track artist.id) {
				<p>
					<!--Links to artist page, display artist name-->
					Artist: <a [routerLink]="['/artist', artist.id]">{{artist.name}}</a>
				</p>
			}
			<p>
				<!--Links to album page on spotify, display album name-->
				<a class="btn btn-light" role="button" target="_blank" [href]="album.url">Open {{album.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-12 col-sm-6">
			<h3>Album Tracks</h3>
			<!--Displays the track list for the album. Hide the artist and album columns because they are redundant on this page.-->
			<app-track-list [tracks]="tracks" [hideArtist]="true" [hideAlbum]="true"></app-track-list>
		</div>
	</div>
}
