<h1>Search Spotify</h1>
<!--Binds input's model to searchString-->
<input [(ngModel)]="searchString" (keyup.enter)="search()">
<!--Binds select's model to searchCategory-->
<select [(ngModel)]="searchCategory">
	<!--Loops over searchCategories to create dropdown options-->
	<option *ngFor="let category of searchCategories" [value]="category">{{category}}</option>
</select>
<!--Calls search function when the button is clicked-->
<button class="btn btn-light" (click)="search()">Search</button>
<!--Displays a carousel component if searching for an artist or album. Bind carousel's resources and give it a static carouselId.-->
<!--Displays a track-list component if searching for a track. Bind track-list's tracks.-->

<div *ngIf="resources">
  <app-carousel *ngIf="searchCategory !== 'track'" [resources]="resources" carouselId="searchCarousel"></app-carousel>
  <app-track-list *ngIf="searchCategory === 'track'" [tracks]="resources"></app-track-list>
</div>
