@if(popularity) {
  <div class="progress">
    <!--Sets style.background-color based on the level of popularity and style.width via the popularity's percent. Display percent.-->
    <div class="progress-bar" role="progressbar" [style.background-color]="popularity.color" [style.width]="popularity.percentageString">
      <span class="progress-bar-text">{{label}}: {{popularity.percentageString}}</span>
    </div>
  </div>
}
